[package]
name = "server-nest"
version = "0.1.0"
description = "A local Python and Node server manager"
authors = ["you"]
edition = "2021"

[lib]
name = "server_nest_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
